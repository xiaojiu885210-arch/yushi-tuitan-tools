function hasCjk(s){return /[\u3400-\u9fff]/.test(s);}
function tokenize(q){
  const out=[]; const cleaned=q.trim().toLowerCase(); if(!cleaned) return out;
  for(const part of cleaned.split(/[\s,，、|/]+/)){
    if(!part) continue; out.push(part);
    if(hasCjk(part)&&part.length>=4){ for(let i=0;i<part.length-1;i++) out.push(part.slice(i,i+2)); }
  }
  return [...new Set(out)];
}
function expand(q){
  const tokens=tokenize(q); const zh=new Set(); const en=new Set(); const tags=new Set(); const topics=new Set();
  if(q.trim()){ if(hasCjk(q)) zh.add(q.trim()); else en.add(q.trim()); }
  for(const t of TOPICS){
    const hit=tokens.some(tok=>t.zh.some(z=>z.includes(tok)||tok.includes(z))||t.en.some(e=>e.toLowerCase().includes(tok)||tok.includes(e.toLowerCase())));
    if(hit){ t.zh.forEach(z=>zh.add(z)); t.en.forEach(e=>en.add(e)); t.tags.forEach(g=>tags.add(g)); topics.add(t.id); }
  }
  for(const [z,ens] of EXTRA){ if(tokens.some(tok=>z.includes(tok)||tok.includes(z))){ zh.add(z); ens.forEach(e=>en.add(e)); } }
  if(!topics.size && q.trim()){
    for(const t of TOPICS.slice(0,6)){ t.zh.forEach(z=>zh.add(z)); t.en.forEach(e=>en.add(e)); t.tags.forEach(g=>tags.add(g)); topics.add(t.id); }
  }
  const extra=new Set(); for(const id of topics) for(const n of (NEI[id]||[])) extra.add(n);
  for(const id of extra){ const t=TOPICS.find(x=>x.id===id); if(!t) continue; t.en.forEach(e=>en.add(e)); t.tags.forEach(g=>tags.add(g)); topics.add(t.id); }
  return {zh:[...zh].slice(0,16),en:[...en].slice(0,16),tags:[...tags].slice(0,12),topics:[...topics]};
}

const KEY="tuitan-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{creators:[],posts:[],jobs:[]};}catch{return{creators:[],posts:[],jobs:[]};}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));}
let store=load();
if(!store.creators.length){store.creators=CREATORS; store.posts=POSTS; save(store);}
let view="home";
const S={q:"独立开发",minLikes:0,minBm:0,minViews:0,raw:"",topic:""};
function toast(m){const t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._id); t._id=setTimeout(()=>t.style.display="none",2200);}
function blobOfC(c){return `${c.handle} ${c.name} ${c.bio} ${(c.topics||[]).join(" ")}`.toLowerCase();}
function blobOfP(p){return `${p.handle} ${p.body} ${(p.topics||[]).join(" ")}`.toLowerCase();}
function matchBlob(blob, plan){
  const keys=[...plan.zh,...plan.en,...plan.tags,...plan.topics].map(s=>s.toLowerCase().replace(/^#/,""));
  if(!keys.length) return true;
  return keys.some(k=>k && blob.includes(k));
}
function searchAll(q){
  const plan=expand(q||"");
  let creators=store.creators.filter(c=>matchBlob(blobOfC(c),plan));
  let posts=store.posts.filter(p=>matchBlob(blobOfP(p),plan));
  posts=posts.filter(p=>p.likes>=S.minLikes && p.bookmarks>=S.minBm && p.views>=S.minViews);
  posts=[...posts].sort((a,b)=>(b.heat||heat(b))-(a.heat||heat(a)));
  creators=[...creators].sort((a,b)=>b.followers-a.followers);
  if(!q.trim()){ creators=store.creators.slice().sort((a,b)=>b.followers-a.followers); posts=store.posts.slice().sort((a,b)=>heat(b)-heat(a)); }
  return {plan,creators,posts};
}
const BM=`(() => {
  const posts = []; const creators = []; const seen = new Set();
  document.querySelectorAll('article[data-testid="tweet"]').forEach(art => {
    const status = art.querySelector('a[href*="/status/"]');
    const href = status ? status.href : "";
    const m = href.match(/x\\.com\\/([^/]+)\\/status\\/(\\d+)/) || href.match(/twitter\\.com\\/([^/]+)\\/status\\/(\\d+)/);
    const bodyEl = art.querySelector('[data-testid="tweetText"]');
    const body = bodyEl ? bodyEl.innerText.trim() : (art.innerText||"").slice(0,180);
    const user = m ? m[1] : "";
    const id = m ? m[2] : href;
    if (!id || seen.has(id) || !body) return; seen.add(id);
    const nums = [...art.querySelectorAll('[data-testid$="count"], [data-testid="app-text-transition-container"]')].map(n => n.innerText).join(" ");
    function grab(label){ const x = art.querySelector('[aria-label*="'+label+'"]'); if(!x) return 0; const n=(x.getAttribute("aria-label")||"").match(/([\\d,.]+)/); return n?Number(n[1].replace(/,/g,"")):0; }
    posts.push({ id, handle: user, body, likes: grab("Like")||grab("赞"), bookmarks: grab("Bookmark")||grab("书签"), views: grab("View")||grab("查看"), replies: grab("Repl")||grab("回复"), reposts: grab("Repost")||grab("转帖"), url: href });
  });
  document.querySelectorAll('[data-testid="UserCell"]').forEach(cell => {
    const a = cell.querySelector('a[href^="/"]');
    const handle = a ? a.getAttribute("href").replace("/","").split("/")[0] : "";
    if (!handle) return;
    const name = (cell.querySelector('[dir="ltr"] span')||{}).innerText || handle;
    const bio = (cell.innerText||"").slice(0,160);
    creators.push({ handle, name, bio, followers: 0, url: "https://x.com/"+handle });
  });
  if (!posts.length && !creators.length) { alert("没抓到帖子。等搜索结果出齐后再点书签。"); return; }
  const payload = { source: "tuitan-bookmarklet", posts, creators };
  try { if (window.opener) window.opener.postMessage(payload, "*"); } catch(e) {}
  const text = JSON.stringify(payload);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>alert("已抓到 "+posts.length+" 帖 / "+creators.length+" 账号。回到推探点「从剪贴板导入」。")).catch(()=>prompt("复制：", text));
  } else prompt("复制：", text);
})()`;
function ingest(payload){
  let n=0;
  if(payload.creators){
    const map=new Map(store.creators.map(c=>[c.handle.toLowerCase(),c]));
    payload.creators.forEach(c=>{
      if(!c.handle) return;
      const old=map.get(c.handle.toLowerCase())||{};
      map.set(c.handle.toLowerCase(),{...old,...c,handle:c.handle,name:c.name||c.handle,bio:c.bio||old.bio||"",followers:Number(c.followers||old.followers||0),lang:c.lang||old.lang||"en",topics:c.topics||old.topics||[],profileUrl:"https://x.com/"+c.handle,source:"import"});
      n++;
    });
    store.creators=[...map.values()];
  }
  if(payload.posts){
    const map=new Map(store.posts.map(p=>[p.id,p]));
    payload.posts.forEach(p=>{
      if(!p.id && !p.body) return;
      const row={id:String(p.id||Math.random()),handle:p.handle||"",body:p.body||"",lang:hasCjk(p.body||"")?"zh":"en",likes:Number(p.likes||0),bookmarks:Number(p.bookmarks||0),views:Number(p.views||0),replies:Number(p.replies||0),reposts:Number(p.reposts||0),topics:p.topics||[],postedAt:p.postedAt||new Date().toISOString(),postUrl:p.url||p.postUrl||"",source:"import"};
      row.heat=heat(row); map.set(row.id,row); n++;
    });
    store.posts=[...map.values()];
  }
  save(store); return n;
}
window.addEventListener("message", ev => {
  if (ev.data && ev.data.source === "tuitan-bookmarklet") { const n=ingest(ev.data); toast("回传 "+n+" 条"); go("search"); }
});
function av(c){
  const ini=(c.name||c.handle||"?").slice(0,1);
  return `<div class="av">${ini}</div>`;
}
function creatorCard(c){
  return `<a class="creator" href="${esc(c.profileUrl)}" target="_blank" rel="noopener">
    ${av(c)}
    <div><div>${esc(c.name)}</div><div class="handle">@${esc(c.handle)} · ${esc(c.lang==="zh"?"中文":"EN")}</div><div class="muted" style="font-size:.82rem;margin-top:4px;">${esc(c.bio)}</div></div>
    <div class="fol">${fmt(c.followers)} 粉</div>
  </a>`;
}
function postCard(p){
  return `<article class="post">
    <div style="display:flex;justify-content:space-between;gap:8px;"><a href="https://x.com/${esc(p.handle)}" target="_blank">@${esc(p.handle)}</a><span class="heat">热度 ${fmt(p.heat||heat(p))}</span></div>
    <div>${esc(p.body)}</div>
    <div class="metrics"><span>播放 ${fmt(p.views)}</span><span>赞 ${fmt(p.likes)}</span><span>藏 ${fmt(p.bookmarks)}</span><span>评 ${fmt(p.replies)}</span></div>
  </article>`;
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===view));
  const live=store.creators.some(c=>c.source==="import")||store.posts.some(p=>p.source==="import");
  const badge=document.getElementById("srcBadge"); badge.textContent=live?"含回传":"资料库"; badge.className="badge"+(live?" ok":"");
  const el=document.getElementById("app");
  if(view==="home"){
    const top=[...store.creators].sort((a,b)=>b.followers-a.followers).slice(0,6);
    const hot=[...store.posts].sort((a,b)=>heat(b)-heat(a)).slice(0,4);
    el.innerHTML=`<section class="hero">
      <p class="muted" style="letter-spacing:.2em;font-size:11px;">X CREATOR SCOUT</p>
      <h1>把中文问题，搜成能跟的博主。</h1>
      <p class="muted">X 对中文不友好。推探会同时跑中文、英文对照、话题标签和账号四条车道，再按播放、点赞、收藏排序。双击这个 html 就能用。</p>
      <div class="row"><button class="btn" data-go="search">全面搜索</button><button class="btn ghost" data-go="connect">接入 / 书签</button></div>
    </section>
    <div class="stats">
      <div class="card"><h3>博主</h3><div class="num">${store.creators.length}</div></div>
      <div class="card"><h3>帖子</h3><div class="num">${store.posts.length}</div></div>
      <div class="card"><h3>车道</h3><div class="num">4</div></div>
    </div>
    <h2 style="font-size:1.1rem;">高粉博主</h2>${top.map(creatorCard).join("")}
    <h2 style="font-size:1.1rem;margin-top:24px;">高收藏帖</h2>${hot.map(postCard).join("")}`;
  } else if(view==="search"){
    const {plan,creators,posts}=searchAll(S.q);
    el.innerHTML=`<h1>全面搜索</h1>
      <p class="muted">输入中文即可。四条车道：中文 · 英文 · 标签 · 账号。</p>
      <div class="searchbox" style="margin-top:12px;"><input id="sq" value="${esc(S.q)}" placeholder="独立开发 / 出海 / AI 创业" /><button class="btn" id="doSearch">搜索</button></div>
      <div class="lanes">${[...plan.zh.slice(0,4),...plan.en.slice(0,4),...plan.tags.slice(0,4)].map(x=>`<span class="chip on">${esc(x)}</span>`).join("")}</div>
      <div class="row" style="margin:0 0 16px;">
        <div><label>最低点赞</label><input id="ml" type="number" value="${S.minLikes}" /></div>
        <div><label>最低收藏</label><input id="mb" type="number" value="${S.minBm}" /></div>
        <div><label>最低播放</label><input id="mv" type="number" value="${S.minViews}" /></div>
      </div>
      <h2 style="font-size:1.05rem;">博主 ${creators.length}</h2>
      ${creators.slice(0,20).map(creatorCard).join("")||`<p class="muted">没有账号。试试「创业」或「indie」。</p>`}
      <h2 style="font-size:1.05rem;margin-top:20px;">帖子 ${posts.length}</h2>
      ${posts.slice(0,30).map(postCard).join("")}`;
  } else if(view==="creators"){
    const rows=[...store.creators].sort((a,b)=>b.followers-a.followers);
    el.innerHTML=`<h1>博主</h1><p class="muted">${rows.length} 个账号，按粉丝。</p>${rows.map(creatorCard).join("")}`;
  } else if(view==="posts"){
    const rows=[...store.posts].sort((a,b)=>heat(b)-heat(a));
    el.innerHTML=`<h1>帖子</h1><p class="muted">按热度（赞 + 藏×3 + 播放/80）。</p>${rows.map(postCard).join("")}`;
  } else if(view==="topics"){
    el.innerHTML=`<h1>话题</h1><p class="muted">点一个话题，按中英对照去搜。</p>
      <div class="grid" style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:16px;">
        ${TOPICS.map(t=>`<button class="card" data-topic="${t.id}" style="text-align:left;color:inherit;">
          <h3 style="color:var(--fg);font-family:var(--display);font-size:1.2rem;">${esc(t.name)}</h3>
          <p class="muted">${esc(t.en.slice(0,3).join(" · "))}</p>
        </button>`).join("")}
      </div>`;
  } else if(view==="connect"){
    el.innerHTML=`<h1>接入</h1>
      <p class="muted">浏览器不能直接调 X 接口。完整实搜路径：在 X 搜索页点书签回传。资料库开箱能搜，不接也能用。</p>
      <div class="card">
        <h3>从 X 回传</h3>
        <ol class="muted" style="line-height:1.7;">
          <li>点下方复制书签脚本，浏览器新建书签，网址粘贴脚本。</li>
          <li>打开 X 搜索（中文或英文都行），等结果出齐。</li>
          <li>点该书签。回到推探，点从剪贴板导入。</li>
        </ol>
        <div class="row">
          <button class="btn" id="copyBm">复制回传书签脚本</button>
          <button class="btn ghost" id="openX">打开 X 搜索</button>
        </div>
      </div>
      <div class="card" style="margin-top:12px;">
        <label>粘贴 JSON</label>
        <textarea id="raw" placeholder='{"source":"tuitan-bookmarklet","posts":[],"creators":[]}'>${esc(S.raw)}</textarea>
        <div class="row"><button class="btn ghost" id="imp">解析并入库</button><button class="btn ghost" id="clip">从剪贴板导入</button></div>
      </div>`;
  }
}
function go(v){view=v; document.getElementById("sheet").classList.remove("on"); render();}
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-go],[data-topic],#doSearch,#copyBm,#openX,#imp,#clip,#menuBtn");
  if(!t) return;
  if(t.id==="menuBtn"){
    document.getElementById("sheet").classList.add("on");
    document.getElementById("sheetNav").innerHTML=`<p style="font-family:var(--display);font-size:1.2rem;">推探</p>`+
      [["home","总览"],["search","搜索"],["creators","博主"],["posts","帖子"],["topics","话题"],["connect","接入"]].map(([id,l])=>`<button data-go="${id}" style="display:block;width:100%;text-align:left;height:44px;border:0;background:transparent;color:inherit;font:inherit;">${l}</button>`).join("");
    return;
  }
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.topic){const tp=TOPICS.find(x=>x.id===t.dataset.topic); S.q=tp?tp.name:t.dataset.topic; go("search"); return;}
  if(t.id==="doSearch"){ S.q=document.getElementById("sq").value; store.jobs=(store.jobs||[]); store.jobs.unshift({q:S.q,at:Date.now()}); save(store); render(); return; }
  if(t.id==="copyBm"){ await navigator.clipboard.writeText("javascript:"+encodeURIComponent(BM)).catch(()=>{}); toast("已复制书签脚本"); return; }
  if(t.id==="openX"){
    const plan=expand(S.q||"indie hacker");
    const q=encodeURIComponent((plan.en[0]||S.q||"indie hacker")+" min_faves:20");
    window.open("https://x.com/search?q="+q+"&src=typed_query&f=live","_blank");
    toast("在 X 页点回传书签"); return;
  }
  if(t.id==="imp"){ S.raw=document.getElementById("raw").value; try{const n=ingest(JSON.parse(S.raw)); toast("入库 "+n+" 条"); go("search");}catch{toast("JSON 解析失败");} return; }
  if(t.id==="clip"){ try{const n=ingest(JSON.parse(await navigator.clipboard.readText())); toast("入库 "+n+" 条"); go("search");}catch{toast("剪贴板没有可用 JSON");} return; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="ml") S.minLikes=Number(e.target.value||0);
  if(e.target.id==="mb") S.minBm=Number(e.target.value||0);
  if(e.target.id==="mv") S.minViews=Number(e.target.value||0);
  if(e.target.id==="ml"||e.target.id==="mb"||e.target.id==="mv") render();
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="sq"){ S.q=e.target.value; render(); }
});
document.getElementById("sheet").addEventListener("click", e=>{ if(e.target.id==="sheet") e.target.classList.remove("on"); });
render();
</script>
</body>
</html>
