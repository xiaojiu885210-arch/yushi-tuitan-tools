function mulberry(seed){return function(){let t=seed+=0x6d2b79f5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}

function stats(rows){
  if(!rows.length) return {n:0,med:null,avg:null,min:null,max:null,p25:null,p75:null,want:0};
  const p=[...rows.map(r=>r.priceFen)].sort((a,b)=>a-b);
  const pick=q=>{const i=(p.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return lo===hi?p[lo]:Math.round(p[lo]*(hi-i)+p[hi]*(i-lo));};
  const sum=p.reduce((a,b)=>a+b,0);
  return {n:p.length,med:pick(.5),avg:Math.round(sum/p.length),min:p[0],max:p[p.length-1],p25:pick(.25),p75:pick(.75),want:rows.reduce((a,r)=>a+r.wantCount,0)};
}
function hist(rows){
  const p=rows.map(r=>r.priceFen); if(!p.length) return [];
  const min=Math.min(...p), max=Math.max(...p), buckets=8;
  if(min===max) return [{label:Math.round(min/100),count:p.length,h:1}];
  const w=(max-min)/buckets; const bars=Array.from({length:buckets},(_,i)=>({from:min+i*w,to:i===buckets-1?max:min+(i+1)*w,count:0}));
  p.forEach(v=>{let i=Math.floor((v-min)/w); if(i>=buckets)i=buckets-1; bars[i].count++;});
  const m=Math.max(...bars.map(b=>b.count),1);
  return bars.map(b=>({label:Math.round(b.from/100),count:b.count,h:b.count/m}));
}

    const wm = text.match(/(\\d+)\\s*人想要/) || text.match(/想要\\s*(\\d+)/);
    const am = text.match(/(北京|上海|广州|深圳|杭州|成都|重庆|武汉|南京|苏州|西安|长沙|天津|郑州|青岛|厦门|合肥|福州|宁波|无锡|东莞|佛山)/);
    items.push({ id: m[1], title, price: pm ? Number(pm[1]) : 0, want: wm ? Number(wm[1]) : 0, area: am ? am[1] : "", url: href.indexOf("http")===0?href:"https://www.goofish.com/item?id="+m[1], pic: img ? img.src : "" });
  }
  if (!items.length) { alert("没抓到商品。等搜索结果出齐后再点一次书签。"); return; }
  const payload = { source: "yushi-bookmarklet", items };
  try { if (window.opener) window.opener.postMessage(payload, "*"); } catch (e) {}
  const text = JSON.stringify(payload);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert("已抓到 " + items.length + " 条。已复制，回到鱼市点「从剪贴板导入」。")).catch(() => prompt("复制下面这一整段，回到鱼市雷达粘贴：", text));
  } else prompt("复制下面这一整段，回到鱼市雷达粘贴：", text);
})()`;
function ingest(payload){
  const items = payload && payload.items ? payload.items : Array.isArray(payload) ? payload : null;
  if(!items) return 0;
  const rows=items.map(it=>{
    const id=String(it.id||"").trim(); const title=String(it.title||"").trim(); if(!id||!title) return null;
    const priceFen = it.priceFen!=null?Number(it.priceFen):Math.round(Number(it.price||0)*100);
    return {id,title:title.slice(0,120),priceFen:Number.isFinite(priceFen)?priceFen:0,wantCount:Number(it.wantCount||it.want||0)||0,area:it.area||"",seller:it.seller||"",categoryId:S.cat,categoryName:catName(S.cat),keyword:S.kw,publishedAt:new Date().toISOString(),itemUrl:it.url||it.itemUrl||("https://www.goofish.com/item?id="+encodeURIComponent(id)),source:"import"};
  }).filter(Boolean);
  mergeItems(rows);
  store.jobs.unshift({at:new Date().toISOString(),source:"import",n:rows.length,kw:S.kw});
  save(store); return rows.length;
}
window.addEventListener("message", ev => {
  if (ev.data && ev.data.source === "yushi-bookmarklet") {
    const n = ingest(ev.data); toast("回传 "+n+" 条"); go("lib");
  }
});
function itemCard(it, i){
  return `<article class="item">
    <div class="rank">${i!=null?("#"+(i+1)):esc(it.source==="demo"?"演示":"实采")}</div>
    <div><div class="title">${esc(it.title)}</div><div class="meta">${esc(it.categoryName||"")} · ${esc(it.area||"")} · 想要 ${it.wantCount} · ${esc(it.seller||"")}</div></div>
    <div class="price">${yuan(it.priceFen)}</div>
  </article>`;
}
function catTree(){
  return CATS.filter(c=>!c.parent).map(r=>{
    const kids=children(r.id);
    return `<button data-cat="${r.id}" class="${S.cat===r.id?"on":""}">${esc(r.name)}</button>`+
      kids.map(k=>`<button class="child ${S.cat===k.id?"on":""}" data-cat="${k.id}">${esc(k.name)}</button>`).join("");
  }).join("");
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===view));
  const live=store.items.some(i=>i.source!=="demo");
  const badge=document.getElementById("srcBadge");
  badge.textContent=live?"含实采":"演示库";
  badge.className="badge"+(live?" ok":"");
  const el=document.getElementById("app");
  if(view==="home"){
    const st=stats(store.items);
    el.innerHTML=`<section class="hero">
      <p class="muted" style="letter-spacing:.2em;font-size:11px;">XIANYU MARKET RADAR</p>
      <h1>选类目，看近期排行和价格带。</h1>
      <p class="muted">演示库开箱即用。实搜：打开闲鱼搜索，点书签把商品回传。双击这个 html 就能用，不用安装。</p>
      <div class="row"><button class="btn" data-go="collect">开始采集</button><button class="btn ghost" data-go="rank">看排行</button></div>
    </section>
    <div class="stats">
      <div class="card"><h3>商品</h3><div class="num">${st.n}</div></div>
      <div class="card"><h3>中位价</h3><div class="num">${st.med!=null?yuan(st.med):"—"}</div></div>
      <div class="card"><h3>想要</h3><div class="num">${st.want}</div></div>
    </div>
    <h2 style="font-size:1.1rem;">最近采集</h2>
    ${(store.jobs||[]).slice(0,6).map(j=>`<div class="item"><div class="rank">${esc(j.source)}</div><div><div class="title">${esc(j.kw)}</div><div class="meta">${esc(j.at).slice(0,16).replace("T"," ")}</div></div><div class="price">${j.n} 条</div></div>`).join("")||`<p class="muted">还没有采集记录。</p>`}`;
  } else if(view==="collect"){
    el.innerHTML=`<h1>采集</h1>
    <p class="muted">选类目和关键词。演示库立刻入库；实搜请用本机闲鱼 + 书签。</p>
    <div class="grid2" style="margin-top:16px;">
      <div class="card"><h3>类目</h3><div class="cats">${catTree()}</div></div>
      <div>
        <div class="card">
          <label>关键词</label><input id="kw" value="${esc(S.kw)}" />
          <div class="chips" style="margin:10px 0;">${PRESETS.map(p=>`<button class="chip" data-preset="${p[2]}|${p[1]}">${esc(p[0])}</button>`).join("")}</div>
          <div class="grid2" style="grid-template-columns:1fr 1fr;margin-top:8px;">
            <div><label>时间窗</label>
              <select id="days">${[1,3,7,14,0].map(d=>`<option value="${d}" ${Number(S.days)===d?"selected":""}>${d?("近 "+d+" 天"):"不限"}</option>`).join("")}</select>
            </div>
            <div><label>数据源</label>
              <select id="mode"><option value="demo" ${S.mode==="demo"?"selected":""}>演示库</option><option value="browser" ${S.mode==="browser"?"selected":""}>本机闲鱼书签</option></select>
            </div>
          </div>
          <div class="row" style="margin-top:12px;">
            <button class="btn" id="run">${S.mode==="browser"?"打开闲鱼搜索":"从演示库入库"}</button>
            <button class="btn ghost" id="copyBm">复制回传书签脚本</button>
          </div>
          <p class="muted" style="margin-top:10px;">书签用法：浏览器新建书签，网址粘贴刚复制的脚本。打开闲鱼搜索结果后点该书签，再回到这里导入。</p>
        </div>
        <div class="card" style="margin-top:12px;">
          <label>粘贴 JSON / 从剪贴板导入</label>
          <textarea id="raw" placeholder='{"source":"yushi-bookmarklet","items":[...]}'>${esc(S.importRaw)}</textarea>
          <div class="row"><button class="btn ghost" id="imp">解析并入库</button><button class="btn ghost" id="clip">从剪贴板导入</button></div>
        </div>
      </div>
    </div>`;
  } else if(view==="rank"){
    let rows=store.items.filter(it=>catMatch(it,S.cat||"software"));
    if(S.days){rows=rows.filter(it=>Date.now()-new Date(it.publishedAt||0).getTime()<=S.days*86400000);}
    rows=[...rows].sort((a,b)=>b.wantCount-a.wantCount).slice(0,80);
    el.innerHTML=`<h1>近期排行</h1>
      <p class="muted">按「想要」排序。当前类目：${esc(catName(S.cat||"software"))}</p>
      <div class="row"><select id="rdays">${[1,3,7,14,0].map(d=>`<option value="${d}" ${Number(S.days)===d?"selected":""}>${d?("近 "+d+" 天"):"不限"}</option>`).join("")}</select>
      <select id="rcat">${CATS.map(c=>`<option value="${c.id}" ${S.cat===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
      <div style="margin-top:16px;">${rows.map((it,i)=>itemCard(it,i)).join("")||`<p class="muted">这一窗没有商品。</p>`}</div>`;
  } else if(view==="lib"){
    let rows=store.items.filter(it=>{
      if(S.q && !kwMatch(it,S.q)) return false;
      return true;
    });
    if(S.libSort==="want") rows=[...rows].sort((a,b)=>b.wantCount-a.wantCount);
    else if(S.libSort==="price") rows=[...rows].sort((a,b)=>a.priceFen-b.priceFen);
    else if(S.libSort==="new") rows=[...rows].sort((a,b)=>(b.publishedAt||"").localeCompare(a.publishedAt||""));
    else rows=[...rows].sort((a,b)=>(b.publishedAt||"").localeCompare(a.publishedAt||""));
    el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;">
      <div><h1>商品库</h1><p class="muted">已入库 ${store.items.length} 条。</p></div>
      <button class="btn" id="csv">导出 CSV</button>
    </div>
    <div class="grid2" style="grid-template-columns:1fr 1fr;margin:16px 0;">
      <div><label>搜索</label><input id="lq" value="${esc(S.q)}" placeholder="标题 / 卖家 / 关键词" /></div>
      <div><label>排序</label><select id="ls"><option value="want" ${S.libSort==="want"?"selected":""}>想要最多</option><option value="new" ${S.libSort==="new"?"selected":""}>最新上架</option><option value="price" ${S.libSort==="price"?"selected":""}>价格低到高</option></select></div>
    </div>
    ${rows.slice(0,200).map(it=>itemCard(it)).join("")}`;
  } else if(view==="market"){
    const rows=store.items.filter(it=>catMatch(it,S.cat||"software"));
    const st=stats(rows); const bars=hist(rows);
    el.innerHTML=`<h1>行情</h1>
      <p class="muted">价格带按当前类目 ${esc(catName(S.cat||"software"))} 统计。</p>
      <div class="row"><select id="mcat">${CATS.map(c=>`<option value="${c.id}" ${S.cat===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
      <div class="stats">
        <div class="card"><h3>样本</h3><div class="num">${st.n}</div></div>
        <div class="card"><h3>中位</h3><div class="num">${st.med!=null?yuan(st.med):"—"}</div></div>
        <div class="card"><h3>P25 – P75</h3><div class="num" style="font-size:1.4rem;">${st.p25!=null?yuan(st.p25)+" – "+yuan(st.p75):"—"}</div></div>
      </div>
      <div class="card"><h3>价格带</h3><div class="hist">${bars.map(b=>`<div class="col"><b style="height:${Math.max(8,b.h*100)}px"></b><span>${b.label}</span></div>`).join("")||"<p class=muted>没有数据</p>"}</div></div>`;
  }
}
function go(v){view=v;document.getElementById("sheet").classList.remove("on");render();}
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-go],[data-cat],[data-preset],#run,#copyBm,#imp,#clip,#csv,#menuBtn,.pane button");
  if(!t) return;
  if(t.id==="menuBtn"){const sh=document.getElementById("sheet"); sh.classList.add("on"); document.getElementById("sheetNav").innerHTML=`<p style="font-family:var(--display);font-size:1.2rem;">鱼市</p>`+["home|总览","collect|采集","rank|排行","lib|商品库","market|行情"].map(x=>{const [id,l]=x.split("|");return `<button data-go="${id}" style="display:block;width:100%;text-align:left;height:44px;border:0;background:transparent;font:inherit;">${l}</button>`;}).join(""); return;}
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.cat){S.cat=t.dataset.cat;render();return;}
  if(t.dataset.preset){const [c,k]=t.dataset.preset.split("|");S.cat=c;S.kw=k;render();return;}
  if(t.id==="copyBm"){await navigator.clipboard.writeText("javascript:"+encodeURIComponent(BM)).catch(()=>{}); toast("已复制书签脚本，粘到浏览器书签网址里"); return;}
  if(t.id==="run"){
    S.kw=document.getElementById("kw").value; S.days=Number(document.getElementById("days").value); S.mode=document.getElementById("mode").value;
    if(S.mode==="demo"){
      const demo=buildDemo();
      const rows=demo.filter(it=>catMatch(it,S.cat) && kwMatch(it,S.kw));
      const take=rows.length?rows:demo.filter(it=>catMatch(it,S.cat));
      mergeItems(take.length?take:demo.slice(0,20));
      store.jobs.unshift({at:new Date().toISOString(),source:"demo",n:(take.length||20),kw:S.kw}); save(store);
      toast("已入库 "+(take.length||20)+" 条演示商品"); go("rank");
    } else {
      const u=new URL("https://www.goofish.com/search"); if(S.kw) u.searchParams.set("q",S.kw);
      window.open(u.toString(),"_blank"); toast("在闲鱼页点「鱼市回传」书签");
    }
    return;
  }
  if(t.id==="imp"){
    S.importRaw=document.getElementById("raw").value;
    try{const n=ingest(JSON.parse(S.importRaw)); toast("入库 "+n+" 条"); go("lib");}
    catch{toast("JSON 解析失败");}
    return;
  }
  if(t.id==="clip"){
    try{const txt=await navigator.clipboard.readText(); const n=ingest(JSON.parse(txt)); toast("入库 "+n+" 条"); go("lib");}
    catch{toast("剪贴板里没有可用 JSON");}
    return;
  }
  if(t.id==="csv"){
    const keys=["id","title","price_yuan","want","area","seller","category","keyword","published_at","url","source"];
    const rows=store.items.map(it=>({id:it.id,title:it.title,price_yuan:(it.priceFen/100).toFixed(2),want:it.wantCount,area:it.area,seller:it.seller,category:it.categoryName,keyword:it.keyword,published_at:it.publishedAt,url:it.itemUrl,source:it.source}));
    const escC=v=>{const s=v==null?"":String(v); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
    const csv="\uFEFF"+[keys.join(","),...rows.map(r=>keys.map(k=>escC(r[k])).join(","))].join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download="yushi-listings.csv"; a.click();
    toast("已导出 CSV"); return;
  }
});
document.addEventListener("change", e=>{
  if(e.target.id==="rdays"||e.target.id==="days") {S.days=Number(e.target.value); render();}
  if(e.target.id==="rcat"||e.target.id==="mcat") {S.cat=e.target.value; render();}
  if(e.target.id==="ls") {S.libSort=e.target.value; render();}
  if(e.target.id==="mode") {S.mode=e.target.value; render();}
});
document.addEventListener("input", e=>{
  if(e.target.id==="lq"){S.q=e.target.value; render(); e.target.focus(); const v=e.target.value; e.target.setSelectionRange(v.length,v.length);}
  if(e.target.id==="kw") S.kw=e.target.value;
  if(e.target.id==="raw") S.importRaw=e.target.value;
});
document.getElementById("sheet").addEventListener("click", e=>{ if(e.target.id==="sheet") e.target.classList.remove("on"); });
render();
</script>
</body>
</html>
